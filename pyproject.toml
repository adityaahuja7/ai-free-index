[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-free-index"
version = "0.1.0"
description = "Collect, enrich and publish an index of free and open-source AI software."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai", "open-source", "index", "catalogue", "gemini", "dashboard"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
]
# Intentionally no runtime dependencies: standard library only.
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
aiindex = "aiindex.cli:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiindex = ["py.typed"]
