name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/index.json"
      - "src/**"
      - ".github/workflows/pages.yml"
  # Commits pushed with a workflow's own GITHUB_TOKEN do NOT fire `push` events,
  # so the daily refresh would commit fresh data that never reached the site.
  # Chain onto the refresh run explicitly instead of relying on the push above.
  workflow_run:
    workflows: ["Refresh index"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A failed refresh leaves the previous dataset in place: nothing new to deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the branch tip: on workflow_run the default SHA can predate the
          # commit the refresh just pushed.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble static site
        run: PYTHONPATH=src python -m aiindex site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
